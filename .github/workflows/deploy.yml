name: Deploy (Azure)

# Manual-trigger CD. Kept separate from ci.yml on purpose: deploys should be an
# explicit human decision, not "every push to main", while cost stays ~$0 when idle
# (Container Apps scale-to-zero + Static Web Apps free tier).
on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Build + push API image and roll it out to Container Apps'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Build + deploy the SPA to Static Web Apps'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Must match the resource group / names created via Docs/diploma/thesis/docs/02-technical/deployment.md.
  AZURE_RESOURCE_GROUP: krepton-analytics-rg
  CONTAINER_APP_NAME: krepton-analytics-api
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/krepton-analytics-api

jobs:
  deploy-backend:
    name: Build + deploy API (Container Apps)
    if: ${{ inputs.deploy_backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=krepton-api
          cache-to: type=gha,mode=max,scope=krepton-api

      - name: Azure login
        uses: azure/login@v2
        with:
          # Service principal JSON, e.g. from:
          #   az ad sp create-for-rbac --name krepton-analytics-cd --role contributor \
          #     --scopes /subscriptions/<sub-id>/resourceGroups/krepton-analytics-rg --sdk-auth
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll out new image to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure logout
        if: always()
        run: az logout

  deploy-frontend:
    name: Build + deploy SPA (Static Web Apps)
    if: ${{ inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Baked into the static build at compile time — must point at the
      # live API custom domain, not localhost.
      VITE_API_URL: https://api.kreptonanalytics.com
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (uses the repo's own build script + env above)
        run: npm run build

      - name: Deploy pre-built SPA to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'frontend/dist'
          output_location: ''
          skip_app_build: true
