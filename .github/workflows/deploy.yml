name: Deploy (Azure)

# Production deploys only after the CI workflow is green on main (lint, tests,
# coverage gate, e2e, audit, docker build). workflow_dispatch is kept for
# emergency / Portal-fix redeploys that skip waiting on a new CI run.
# Cost stays ~$0 when idle (Container Apps scale-to-zero + Static Web Apps free tier).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Build + push API image and roll it out to Container Apps'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Build + deploy the SPA to Static Web Apps'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  # Must match the resource group / names created via Docs/diploma/thesis/docs/02-technical/deployment.md.
  AZURE_RESOURCE_GROUP: krepton-analytics-rg
  CONTAINER_APP_NAME: krepton-analytics-api
  # Hardcoded lowercase: GHCR/OCI repository names must be all-lowercase, but the GitHub
  # org/owner name ("Krepto-vlad") is mixed-case, so github.repository_owner can't be used here.
  IMAGE_NAME: ghcr.io/krepto-vlad/krepton-analytics-api
  API_HEALTH_URL: https://api.kreptonanalytics.com/health
  FRONTEND_HEALTH_URL: https://www.kreptonanalytics.com
  # workflow_run must deploy the commit that CI tested, not the default-branch SHA of this file.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  refuse-if-ci-failed:
    name: Refuse deploy when CI is red
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail because CI did not pass
        run: |
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Refusing to deploy."
          exit 1

  deploy-backend:
    name: Build + deploy API (Container Apps)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_backend) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=krepton-api
          cache-to: type=gha,mode=max,scope=krepton-api

      - name: Azure login
        uses: azure/login@v2
        with:
          # Service principal JSON, e.g. from:
          #   az ad sp create-for-rbac --name krepton-analytics-cd --role contributor \
          #     --scopes /subscriptions/<sub-id>/resourceGroups/krepton-analytics-rg --sdk-auth
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll out new image to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}

      - name: Wait until live API is healthy
        run: |
          for i in $(seq 1 36); do
            if curl -sf "${{ env.API_HEALTH_URL }}" > /dev/null; then
              echo "API healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time" >&2
          curl -sS "${{ env.API_HEALTH_URL }}" || true
          exit 1

      - name: Azure logout
        if: always()
        run: az logout

  deploy-frontend:
    name: Build + deploy SPA (Static Web Apps)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Baked into the static build at compile time — must point at the
      # live API custom domain, not localhost.
      VITE_API_URL: https://api.kreptonanalytics.com
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (uses the repo's own build script + env above)
        run: npm run build

      - name: Deploy pre-built SPA to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'frontend/dist'
          output_location: ''
          skip_app_build: true

      - name: Wait until live SPA responds
        run: |
          for i in $(seq 1 24); do
            if curl -sf "${{ env.FRONTEND_HEALTH_URL }}" > /dev/null; then
              echo "Frontend healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not become reachable in time" >&2
          curl -sS -I "${{ env.FRONTEND_HEALTH_URL }}" || true
          exit 1
